name: Feature request
description: Suggest a plot type, journal preset, lint rule or option.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Journal preset
        - Lint rule
        - Plot type
        - Spec option
        - CLI / API
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the figure or workflow that is currently awkward.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A spec snippet, command line or API sketch is ideal.
      render: yaml

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to work on it?
      options:
        - label: I can open a pull request for this.
