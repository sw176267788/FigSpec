version: 1

meta:
  title: Ablation over depth and patch size
  description: >-
    Top-1 accuracy for a grid of ViT depth and patch size settings. Accuracy
    peaks at depth 24 with 32-pixel patches.
  tags: [ablation, vision]

figure:
  journal: cell
  layout: single
  formats: [pdf, svg, png]

axes:
  x:
    label: Patch size
  y:
    label: Depth

series:
  - type: heatmap
    cmap: viridis
    matrix:
      - [68.2, 72.4, 74.1, 73.0, 70.5]
      - [71.5, 75.8, 77.2, 76.1, 73.9]
      - [74.9, 79.2, 80.6, 79.4, 77.1]
      - [76.1, 80.4, 81.9, 80.7, 78.3]
      - [76.8, 81.0, 82.3, 81.2, 78.9]
    row_labels: ["d=6", "d=8", "d=12", "d=16", "d=24"]
    col_labels: ["p=8", "p=16", "p=32", "p=64", "p=112"]
    annotate: true
    params:
      colorbar_label: Top-1 accuracy (%)
