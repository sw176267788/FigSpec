name: ieee
display_name: IEEE Transactions
publisher: IEEE
column_widths:
  single: 3.500     # 88.9 mm
  1.5: 5.250
  double: 7.160     # 181.9 mm
max_height: 9.500
font:
  family: [Times New Roman, Times, DejaVu Serif]
  size: 8
  min_size: 6
  label_size: 9
line:
  width: 0.5
  min_width: 0.25
  marker_size: 3
dpi:
  raster: 300
  lineart: 600
formats: [pdf, eps]
preferred_palette: tol-bright
max_colors: 7
notes: >-
  IEEE Transactions use a 3.5 in single column and 7.16 in double column.
  Figures should be legible in greyscale; 8 pt serif text matches the body.
source: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/
