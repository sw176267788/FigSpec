site_name: figspec
site_description: Declarative, publication-ready, reproducible scientific figures.
site_url: https://sw176267788.github.io/FigSpec/
repo_url: https://github.com/sw176267788/FigSpec
repo_name: sw176267788/FigSpec
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The figspec Authors

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Gallery: gallery.md
  - Spec reference: spec-reference.md
  - Journal presets: journals.md
  - Lint rules: lint-rules.md
  - Provenance: provenance.md
  - CLI: cli.md
  - Recipes: recipes.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
